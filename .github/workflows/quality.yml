name: Quality

on:
  pull_request:
  push:
    branches: [main, feat/app-development-icon-baseline]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build and test the packed distributable
        run: npm run test:package
      - run: npm --prefix preview-client ci
      - run: npm --prefix preview-client run build
